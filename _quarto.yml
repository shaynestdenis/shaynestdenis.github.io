        aria-label: LinkedIn profile
  page-footer:
    left: "Department of Economics, University of Manitoba · Winnipeg, Manitoba"
    right: "[stdenis1@myumanitoba.ca](mailto:stdenis1@myumanitoba.ca) · [shayne.st.denis@gmail.com](mailto:shayne.st.denis@gmail.com) · [LinkedIn](https://www.linkedin.com/in/shayne-st-denis-13603a94/)"

