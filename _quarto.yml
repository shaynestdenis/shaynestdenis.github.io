    background: light
    right:
      - text: Research
        href: research.qmd
      - text: Consulting
        href: consulting.qmd
      - text: Golf
        href: golf.qmd
      - text: CV (PDF)
        href: files/St_Denis_CV.pdf
      - icon: linkedin
